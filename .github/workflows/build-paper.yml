name: Build paper PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: 04_Drafts/paper
          root_file: main.tex
      - name: Upload PDF preview
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: 04_Drafts/paper/main.pdf
          if-no-files-found: error

  publish-preview:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download compiled PDF
        uses: actions/download-artifact@v4
        with:
          name: paper-pdf
          path: preview
      - name: Update private preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="paper-preview"
          if ! gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X POST "repos/$repo/git/refs" \
              -f ref="refs/heads/$branch" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          existing_sha="$(gh api "repos/$repo/contents/paper.pdf?ref=$branch" --jq .sha 2>/dev/null || true)"
          base64 -w0 preview/main.pdf |
            jq -Rs --arg branch "$branch" \
              --arg message "Update paper preview from $GITHUB_SHA" \
              --arg sha "$existing_sha" \
              '{message: $message, content: ., branch: $branch} +
               (if $sha == "" then {} else {sha: $sha} end)' |
            gh api -X PUT "repos/$repo/contents/paper.pdf" --input - >/dev/null
